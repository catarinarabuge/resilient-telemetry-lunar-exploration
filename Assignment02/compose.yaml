version: "3.9"

networks:
  deep-space-net:
  ground-control-net:

volumes:
  kafka-data:
  influx-data:

services:

  kafka:
    image: bitnamilegacy/kafka:latest
    container_name: kafka
    networks:
      - deep-space-net
      - ground-control-net
    ports:
      - "9094:9094"
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:latest
    networks:
      - ground-control-net
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  telegraf:
    image: telegraf:latest
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - INFLUX_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - deep-space-net
      - ground-control-net
    hostname: lunar-gateway

  producer_mobility:
    build: ./producers
    command: ["python", "-u", "producer_mobility.py"]
    networks:
      - deep-space-net
    depends_on:
      kafka:
        condition: service_healthy

  producer_eclss:
    build: ./producers
    command: ["python", "-u", "producer_eclss.py"]
    networks:
      - deep-space-net
    depends_on:
      kafka:
        condition: service_healthy

  producer_hga:
    build: ./producers
    command: ["python", "-u", "producer_hga.py"]
    networks:
      - deep-space-net
    depends_on:
      kafka:
        condition: service_healthy


