[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  hostname = "lunar-gateway"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["telemetry-mobility", "telemetry-eclss", "telemetry-comms"]
  consumer_group = "telegraf-group"
  offset = "oldest"
  version = "3.0.0"
  client_id = "telegraf-client"

  data_format = "influx"
  influx_parser_type = "line"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "esa-sic"
  bucket = "lunar-mission"

